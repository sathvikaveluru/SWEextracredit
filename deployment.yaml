apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentsurvey-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studentsurvey
  template:
    metadata:
      labels:
        app: studentsurvey
    spec:
      containers:
      - name: studentsurvey
        image: sveluru2/studentsurvey646:7.4
        imagePullPolicy: Always  # ✅ force pull from Docker Hub
        ports:
        - containerPort: 8080
