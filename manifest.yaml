apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentsurvey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studentsurvey
  template:
    metadata:
      labels:
        app: studentsurvey
    spec:
      containers:
        - name: studentsurvey
          image: sveluru2/studentsurvey646:8.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: survey-env

---
apiVersion: v1
kind: Service
metadata:
  name: studentsurvey-service
spec:
  type: LoadBalancer
  selector:
    app: studentsurvey
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30684
