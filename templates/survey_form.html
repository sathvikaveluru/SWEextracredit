<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Survey Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 500px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row input {
            flex: 1;
        }
        label {
            font-weight: bold;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            margin-top: 20px;
            padding: 12px;
            background-color: #004d99;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #003366;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Campus Visit Survey</h1>
        <form action="/submit-survey" method="post">
            <label>Name:</label>
            <div class="row">
                <input type="text" name="first_name" placeholder="First Name" required>
                <input type="text" name="last_name" placeholder="Last Name" required>
            </div>

            <label>Address:</label>
            <input type="text" name="street_address" placeholder="Street Address">
            <div class="row">
                <input type="text" name="city" placeholder="City">
                <input type="text" name="state" placeholder="State">
            </div>
            <div class="row">
                <input type="text" name="zip" placeholder="ZIP Code">
                <input type="text" name="phone" placeholder="Phone Number">
            </div>

            <label>Email:</label>
            <input type="email" name="email" placeholder="Email" required>

            <label>Date of Survey:</label>
            <input type="date" name="survey_date" required>

            <label>What did you like most?</label>
            <select name="liked_most">
                <option value="Students">Students</option>
                <option value="Location">Location</option>
                <option value="Campus">Campus</option>
                <option value="Atmosphere">Atmosphere</option>
                <option value="Dorm Rooms">Dorm Rooms</option>
                <option value="Sports">Sports</option>
            </select>

            <label>How did you become interested?</label>
            <select name="interested_via">
                <option value="Friends">Friends</option>
                <option value="Television">Television</option>
                <option value="Internet">Internet</option>
                <option value="Other">Other</option>
            </select>

            <label>Likelihood of recommending:</label>
            <select name="recommendation">
                <option value="Very Likely">Very Likely</option>
                <option value="Likely">Likely</option>
                <option value="Unlikely">Unlikely</option>
            </select>

            <button type="submit">Submit Survey</button>
        </form>
    </div>
</body>
</html>
